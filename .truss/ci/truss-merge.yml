# truss-merge — written by `truss ci add merge` (Truss, D-115/D-116).
# Merges every pull request opened from a branch of this repository as soon as
# `truss doctor` reports no error (exit 0 or 1). On errors it comments the
# findings and waits: push a fix to the same branch and it runs again.
#
# No human approval is required — this is the team's agreed flow, not a lock.
# On a private repository with GitHub Free nothing stops a direct push to main
# or a manual merge; this workflow is the path agents follow, not a barrier.
# If the repository restricts workflow permissions to read-only, allow
# "Read and write permissions" under Settings → Actions → General.
# Limits: a merge made with GITHUB_TOKEN does not trigger other workflows, so
# main is not re-checked after it (the check ran on the merge result instead);
# and GITHUB_TOKEN cannot merge a pull request that changes .github/workflows/
# — merge that one by hand.
name: truss-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: truss-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      # Default ref for pull_request = the merge result (refs/pull/N/merge):
      # doctor sees main plus this PR, so an ID another PR already took on
      # main shows up here (RF-03), not after the merge.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: truss doctor
        id: doctor
        env:
          TRUSS_NO_PRESENCE: '1'
        run: |
          set +e
          node .truss/bin/truss.mjs doctor > "$RUNNER_TEMP/doctor.txt" 2>&1
          code=$?
          # Exit 1 is both "warnings" and "node crashed". Only a report that
          # doctor actually printed counts; anything else is treated as an error.
          if ! grep -q '^truss doctor' "$RUNNER_TEMP/doctor.txt"; then code=2; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          sed 's/^::/ ::/' "$RUNNER_TEMP/doctor.txt"
          exit 0
      - name: merge
        if: steps.doctor.outputs.code == '0' || steps.doctor.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
      - name: report errors
        if: steps.doctor.outputs.code != '0' && steps.doctor.outputs.code != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'truss doctor found errors, so this pull request was not merged. Fix them and push to the same branch; the merge runs again.'
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/doctor.txt"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md" --repo "$GITHUB_REPOSITORY"
          exit 1
